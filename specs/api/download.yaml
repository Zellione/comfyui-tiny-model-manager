download:
  - POST /api/download -> enqueue a file download (url, model_type, filename, platform, source_id)
  - GET /api/download/status -> poll all active download tasks

search:
  - GET /api/search/civitai -> search CivitAI (params: q, type, base_model, format, sort, period, tags)
  - GET /api/search/huggingface -> search HuggingFace (params: q, sort, direction, format, tags)
  - GET /api/search/huggingface/files -> list files for a HF repo (params: repo)

civitai:
  - GET /api/civitai/versions/{model_id} -> list versions and files for model
  - GET /api/civitai/resolve/{version_id} -> resolve filename and model_type from version ID
