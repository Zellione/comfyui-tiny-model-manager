feature_id: F-38
title: "Visual Upgrade — Model Detail View + Delete"
requirements:
  - Full visual redesign of the model detail page using the existing global design token system (Geist fonts, surface/border/accent tokens, radius scale)
  - Header bar with breadcrumb navigation (Installed / {type} / {filename}), an Edit button, and an Uninstall button
  - Clicking Uninstall shows an inline danger-styled confirmation banner; confirming deletes the file and metadata and navigates back to /models; cancelling dismisses the banner
  - Read view and Edit view are separate — the card shows clean read-only information by default; clicking Edit switches the card to the editable form; Save or Cancel returns to read view
  - Gallery upgraded from narrow 200 px side column to full-width 16:9 main preview with a horizontal thumbnail strip below (active thumb highlighted with accent border); thumbnail strip hidden when only one media item
  - Trigger keywords section shows all words as a single comma-separated monospace line that is clickable to copy to clipboard (with Copied ✓ feedback); individual accent-colored chips are shown below; empty state shows a "No trigger words" message
  - Tags shown as badge chips below the gallery; section hidden when empty
  - Description shown as a read-only "About this model" block at the bottom of the card; hidden when empty
  - "Files in this model" section lists the locally downloaded file with a green Downloaded pill, filename, and formatted size (available-file listing from the source repo is deferred to F-39)
  - Card header eyebrow line shows model type, base model, and file size separated by dots; empty segments are omitted
  - Source link ("View on CivitAI ↗" / "View on HuggingFace ↗") shown in the card header when source_url is set
  - Edit panel preserves all existing editable fields: description, model type (select), base model, trigger words (chip add/remove), tags (chip add/remove)
  - Re-fetch Metadata and Add to Workflow actions are available inside the Edit panel
  - Backend metadata endpoint extended to include size_bytes (resolved via os.path.getsize at request time; returns 0 if file is missing)
api:
  - "GET /tiny-model-manager/api/models/{type}/{path}/metadata — response extended with size_bytes: int"
  - "DELETE /tiny-model-manager/api/models/{type}/{path} — existing endpoint, now wired to the Uninstall button"
  - "PUT /tiny-model-manager/api/models/{type}/{path}/metadata — unchanged"
  - "POST /tiny-model-manager/api/models/{type}/{path}/refetch — unchanged"
  - "GET /tiny-model-manager/api/media/{path} — unchanged"
depends_on:
  - F-09
  - F-34
