feature_id: F-12
title: Settings in ComfyUI Settings Panel
requirements:
  - "ComfyUI JS extension (`app.registerExtension`) registers settings entries under a \"Tiny Model Manager\" category: CivitAI API Key, HuggingFace Token, Media Storage Directory, Organize models into subfolders"
  - "Entries read from and write to the existing backend `GET/PUT /api/settings` (single source of truth: `data/settings.json`); masking rules (`***`) are preserved"
  - The standalone Angular Settings page and its nav link are removed; the `/settings` route is dropped
  - "The JS extension file lives outside the Angular build output so it is not overwritten on rebuild (see Directory Structure: `js/`)"
  - "**Media Storage Directory** uses a custom DOM renderer: a text input whose placeholder shows the computed default path (fetched from `media_dir_default` in `GET /api/settings`) and a **Restore default** button that clears the field back to empty (backend interprets empty as default)"
  - "**Organize models into subfolders** uses a custom CSS toggle switch (DOM-based renderer) for visual consistency across ComfyUI versions; failed saves (e.g. 409 when deorganize queue is pending) revert the visual toggle and show an alert"
  - "`GET /api/settings` response includes `media_dir_default` (absolute computed path to `data/media`) for use as the input placeholder"
