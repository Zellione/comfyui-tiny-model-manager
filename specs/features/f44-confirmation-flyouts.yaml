feature_id: F-44
title: "Confirmation Flyouts"
requirements:
  - "A reusable ConfirmPopoverComponent replaces every existing browser confirm() call and modal confirmation dialog across the application"
  - "The popover renders inline, anchored to the button or element that triggered the action, and does not block the rest of the UI"
  - "The popover displays a short question string and two buttons: Cancel and Confirm"
  - "Clicking Confirm executes the intended action and dismisses the popover"
  - "Clicking Cancel dismisses the popover without executing any action"
  - "Clicking outside the open popover dismisses it without executing the action"
  - "Pressing Escape while a popover is open dismisses it without executing the action"
  - "Only one confirmation popover is open at a time; opening a second one closes the first"
  - "Affected actions include at minimum: delete model, re-fetch metadata, and cancel download"
  - "The component accepts an input for the question text so each call-site can customise the message"
depends_on:
  - F-03
  - F-06
  - F-09
