feature_id: F-24
title: "Search Filtering & Sorting"
requirements:
  - "(SDXL, Illustrious, Pony, Flux, Qwen, Z Image Turbo, Chroma, …) — options populated dynamically from the platform's available values; applied server-side where the platform supports it (CivitAI `baseModels` param), hidden for HuggingFace (see F-29)"
  - "(`.safetensors`, `.gguf`, `.ckpt`, `.pt`, `.bin`)"
  - "Most Downloaded / Highest Rated / Newest, plus a time period (Day / Week / Month / Year / All Time) — maps to CivitAI's `sort` + `period` params"
  - "Downloads / Likes / Trending / Recently Updated / Recently Created — maps to HuggingFace's `sort` (`downloads`, `likes`, `trending`, `lastModified`, `createdAt`) + `direction`"
  - "Defaults preserve current behaviour (HuggingFace defaults to downloads, descending)"
  - Filter and sort changes auto-trigger a new search immediately (no need to press Search again) provided at least one explicit search has already been performed
  - "For HuggingFace, when `.gguf` format is selected the search uses `filter=gguf` server-side (replacing the `pipeline_tag` restriction) so that GGUF repositories are discoverable"
api:
  - "Extend `GET /api/search/civitai` with `base_model`, `format`, `sort`, `period` query params"
  - "Extend `GET /api/search/huggingface` with `sort`, `direction`, `format` query params"
depends_on:
  - F-29
