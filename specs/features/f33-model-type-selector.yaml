feature_id: F-33
title: Model Type Selectable for Every Model
requirements:
  - "model-type dropdown is available for every downloadable item: CivitAI search results HuggingFace search results, and all paste-a-link flows (F-17–F-20)"
  - "Where the type is auto-detected (CivitAI), the dropdown is pre-filled with the detected type but remains changeable — this relaxes F-18's \"pre-filled and disabled (greyed out)\" behaviour"
  - "For HuggingFace, selection is required (F-30)"
  - The chosen type is passed as `model_type` to `POST /api/download`
depends_on:
  - F-17
  - F-20
  - F-18
  - F-30
