feature_id: F-36
title: Filter Download Search Results by Tags
requirements:
  - "multi-tag chip input on the Download page (consistent with the library tag filter, F-25); adding or removing a tag re-runs the search immediately"
  - "Tag filtering is applied **server-side** via each platform's API: - **HuggingFace** — tags map to repeated `filter` params (AND matching), combined with the existing `pipeline_tag` / `gguf` filter - **CivitAI** — the `/models` API supports a single `tag` param, so the first selected tag is applied server-side (multi-tag server filtering is HuggingFace-only)"
  - "Tags are passed through to the \"Load more\" pagination calls so paged results stay filtered"
  - Defaults preserve current behaviour when no tag is set
api:
  - Extend `GET /api/search/civitai` with a `tags` param (comma-separated; first tag applied)
  - Extend `GET /api/search/huggingface` with a `tags` param (comma-separated; all applied as `filter` AND-matched)
depends_on:
  - F-25
