feature_id: F-28
title: Side-by-Side Download View
requirements:
  - "— a narrow scrollable list (max-height capped, internal scroll); each row shows a thumbnail, the name, the model type (checkpoint, lora, …), the base model (for LoRAs and wherever known), and a truncated tag list (≤ 2 tags shown inline)"
  - "— a detail view for the selected item, itself split into two inner columns: - **Inner left** — image/video gallery (large main view + scrollable thumbnail strip), name tags as chips, trigger words as chips, and formatted description - **Inner right** — version + file picker with batch-download checkboxes and a link to the model on its source platform"
  - "The detail pane header (title, badges, source link, stats) spans both inner columns"
  - "HuggingFace inner left shows: gallery images sourced from the repo's root image siblings (`.jpg`, `.png`, `.webp`, `.gif`) when available, plus tags chips; inner right shows: files list (auto-fetched); README description is loaded lazily and displayed full-width below the body"
  - "Tags, trigger words (CivitAI), and description are placed full-width below the two-column body; the versions/files column is height-capped to the gallery height (320 px) with internal scroll"
  - "The **image/video gallery** shows a large main view with a scrollable thumbnail strip below; clicking a thumbnail promotes it to the main view; video items (`.mp4`, `.webm`, `.mov`) render in a `<video controls>` element in the main view and show a play-icon overlay on their thumbnail; the thumbnail strip is vertical on the left of the main image"
  - Clicking a row in the left list opens its detail in the right pane; gallery index resets
  - The first result is selected by default (auto-select after every new search)
  - button lives at the bottom of the left list pane
  - "When no search has been performed, show a centered prompt card with instructions"
  - "When there are no results, the side-by-side view is hidden and replaced by a message box explaining that there were no search results"
  - Works for both CivitAI and HuggingFace result sets
  - "outer split stacks at ≤ 768 px (list on top, detail below); inner detail split stacks at ≤ 900 px (gallery/info on top, download list below)"
  - "refined hover/selected states, clean typography hierarchy, subtle depth on the detail pane"
