feature_id: F-43
title: "Copy Trigger Words"
requirements:
  - "The Model Detail page shows a copy icon button inline with the 'Trigger Words' section header; the button is hidden when the model has no trigger words"
  - "The model card action menu on the Models library page includes a 'Copy trigger words' item; the item is hidden when the model has no trigger words"
  - "Clicking either control copies all trigger words to the clipboard as a comma-separated string (e.g. 'word1, word2, word3')"
  - "After a successful copy, a toast notification appears with the message 'Trigger words copied'"
  - "If the Clipboard API is unavailable or the write fails, a toast notification appears with an error message instead of silently failing"
  - "No new API endpoints or database changes are required; trigger words are read from already-stored metadata"
depends_on:
  - F-09
  - F-13
  - F-34
