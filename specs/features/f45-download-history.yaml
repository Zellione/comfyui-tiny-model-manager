feature_id: F-45
title: "Download Activity & History Log"
requirements:
  - "The Download page gains a tab bar with two tabs: 'Active' and 'History'"
  - "The Active tab replaces the current 'Download Models' panel and shows at most 5 entries"
  - "Active entries are ordered newest-first (most recently started at the top)"
  - "When more than 5 downloads are queued or running, only the 5 most recent are visible in the Active tab; the rest are still tracked in history"
  - "A completed, canceled, or failed entry is automatically removed from the Active tab 60 seconds after reaching its terminal state"
  - "The History tab lists every download ever initiated, in reverse-chronological order (most recent at top)"
  - "Each History entry displays: model name, source platform (CivitAI or HuggingFace), final status, and the timestamp when the terminal state was reached"
  - "Supported final-status values are: in_library, canceled, deleted, failed"
  - "When a model file is deleted from the library, the corresponding History entry status updates from in_library to deleted"
  - "The History tab provides a status filter (chip group or dropdown) allowing the user to show only entries with a specific status"
  - "The History tab provides a text search field that filters entries by model name (case-insensitive, partial match)"
  - "History entries whose status is canceled, deleted, or failed show a 'Redownload' button"
  - "Clicking 'Redownload' opens a confirmation flyout (F-44 pattern) before queuing the download"
  - "Confirming the flyout queues a new download for the same model/version; a new History entry is created and the old one is unchanged"
  - "History data is persisted in SQLite and survives ComfyUI restarts"
  - "The History list is paginated or uses infinite scroll; at minimum 50 entries are loaded per page"
  - "If no history entries match the active filter/search, the History tab shows a 'No results' empty state"
api:
  - "GET /tiny-model-manager/api/download/history — returns paginated download history; query params: status (optional), q (optional model name search), page, page_size"
  - "POST /tiny-model-manager/api/download/history/{id}/redownload — queues a new download from an existing history entry; responds with the new active download task"
db:
  - "New table download_history: id (PK), model_name, source (civitai|huggingface), model_id, version_id, file_url, dest_path, status (in_library|canceled|deleted|failed), created_at, updated_at"
  - "The downloader service writes a row to download_history when a download starts and updates status on completion, cancellation, or failure"
  - "The model-delete route updates any download_history rows whose dest_path matches the deleted file, setting status=deleted"
depends_on:
  - F-06
  - F-44
