feature_id: F-40
title: "Persistent Model Catalog Entry"

overview: >
  Model entries are decoupled from locally downloaded files. An entry is anchored
  to the upstream source page (CivitAI model or HuggingFace repo) and persists in
  the catalog even after all its files are deleted from disk. A catalog entry can
  be browsed, re-downloaded from, or explicitly removed by the user.

requirements:
  # --- Catalog entity ---
  - A new catalog_entries table stores one row per upstream source page, keyed on
    (source_platform, source_page_id); source_page_id is the CivitAI model ID or
    the HuggingFace repo ID (e.g. "stabilityai/stable-diffusion-xl-base-1.0")
  - A catalog entry is created automatically when any file from that source is
    first downloaded or when the user bookmarks a model from search results
  - The entry stores: display_name (from API), source_platform, source_page_id,
    source_page_url, thumbnail_url, base_model, and created_at

  # --- Empty state ---
  - An entry is considered "empty" when none of its associated files exist on disk
    at read time (checked via filesystem stat, not persisted)
  - The library page shows empty entries with a distinct visual treatment
    (e.g. dimmed card, "No files downloaded" badge) so users can distinguish them
    from fully-installed models
  - Empty entries are hidden by default; a "Show empty" toggle in the library
    filters them back in

  # --- Persistence and deletion ---
  - Deleting (uninstalling) a model file does NOT remove the catalog entry
  - A catalog entry is removed only when the user explicitly clicks
    "Remove from catalog" on the catalog entry detail page or card action menu
  - Removing the catalog entry also deletes all associated repo_files rows (F-39)
    and any stored media from disk

  # --- Re-download ---
  - The catalog entry detail page lists all known files (from repo_files, F-39)
    with per-file Download buttons, enabling re-download of any previously seen file
  - The per-file download button is identical to the one specified in F-39

  # --- Per-file base model and subfolder ---
  - When available from the API, each sibling file carries its own base_model field
    (fetched per-file from the provider); sibling downloads are organized into
    subfolders using the file's own base_model (via the organize-into-subfolders
    logic from F-35), not the primary model's base_model

db_schema:
  catalog_entries:
    - "id INTEGER PRIMARY KEY AUTOINCREMENT"
    - "source_platform TEXT NOT NULL — civitai | huggingface"
    - "source_page_id TEXT NOT NULL — CivitAI model ID or HuggingFace repo ID"
    - "source_page_url TEXT NOT NULL"
    - "display_name TEXT NOT NULL DEFAULT ''"
    - "thumbnail_url TEXT NOT NULL DEFAULT ''"
    - "base_model TEXT NOT NULL DEFAULT ''"
    - "created_at TEXT DEFAULT (datetime('now'))"
    - "UNIQUE (source_platform, source_page_id)"

api:
  - "GET /tiny-model-manager/api/catalog — list all catalog entries with is_empty computed from disk"
  - "GET /tiny-model-manager/api/catalog/{platform}/{page_id} — detail for one entry including repo_files"
  - "DELETE /tiny-model-manager/api/catalog/{platform}/{page_id} — remove entry, its repo_files, and stored media"

depends_on:
  - F-39
  - F-35
