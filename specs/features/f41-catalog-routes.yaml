feature_id: F-41
title: "Catalog Routes + HuggingFace base_model Persistence"

overview: >
  Two related improvements to routing and data consistency.

  Route restructuring: the current /models/:type/:path URL exposes the internal model
  type ("checkpoints", "loras") as a visible URL segment. For catalog-linked models this
  is redundant — platform + pageId already uniquely identify the model. Additionally,
  uninstalled catalog entries use a simpler CatalogDetail page while installed models use
  the richer ModelDetail, causing an inconsistent experience.

  HF base_model persistence: when organize_into_subfolders is enabled and the user
  changes base_model, the backend moves the file into a subfolder and updates
  models.filename. The PUT /metadata response returns only {success: true} without the
  new path. The frontend retains the old URL so subsequent loads return empty metadata,
  making the change appear unsaved.

requirements:
  # --- Route restructuring ---
  - Rename the "Models" nav tab to "Catalog"; main list URL /models -> /catalog with
    a redirect from /models for backward compatibility
  - All catalog-linked models (installed or uninstalled) navigate to
    /catalog/:platform?pageId=X — no model_type in the URL
  - Unlinked local models (manually placed, no catalog source) fall back to
    /models/:type/:path
  - CatalogDetail page is enhanced to show the same rich layout as ModelDetail when the
    catalog entry has installed files: gallery, trigger words, description, tags, edit
    mode (edit base_model, description, trigger words, tags), Re-fetch Metadata button
  - When no files are installed, CatalogDetail shows a placeholder gallery, hides trigger
    words and description, keeps the repo files download list

  # --- HF base_model persistence ---
  - PUT /tiny-model-manager/api/models/{type}/{path}/metadata response body must include
    new_path: the original path when no file move occurred, or the new subfolder path
    when organize_into_subfolders moved the file
  - Frontend model-detail save() reads new_path from the response; if it differs from
    the current modelPath, updates modelPath and navigates to the new URL so subsequent
    reloads fetch the correct DB record
  - CatalogDetail save() applies the same new_path navigation pattern

api_changes:
  - "PUT /api/models/{type}/{path}/metadata — response now includes new_path field"

frontend_routes:
  - "{ path: 'catalog', component: Models }  # renamed from 'models'"
  - "{ path: 'models', redirectTo: 'catalog', pathMatch: 'full' }"
  - "{ path: 'catalog/:platform', component: CatalogDetail }  # unchanged"
  - "{ path: 'models/:type/:path', component: ModelDetail }  # kept for unlinked local"

files:
  frontend:
    - frontend/src/app/app.routes.ts
    - frontend/src/app/app.html
    - frontend/src/app/pages/models/models.ts
    - frontend/src/app/pages/catalog-detail/catalog-detail.ts
    - frontend/src/app/pages/catalog-detail/catalog-detail.html
    - frontend/src/app/pages/catalog-detail/catalog-detail.scss
    - frontend/src/app/pages/catalog-detail/catalog-detail.spec.ts
    - frontend/src/app/pages/model-detail/model-detail.ts
    - frontend/src/app/services/model.ts
  backend:
    - py/routes/metadata.py
    - tests/test_routes_metadata.py

dependencies:
  - F-40  # catalog_entries table and catalog API must exist
