feature_id: F-42
title: "Cancel Download"
requirements:
  - Each active download entry in the download queue shows a Cancel button in its row
  - "The progress bar area shows a \"Cancel all\" control that cancels every currently active or queued download"
  - "Clicking Cancel on a row calls DELETE /tiny-model-manager/api/downloads/{id}; the UI removes the entry immediately on success"
  - "Clicking \"Cancel all\" calls DELETE for each active/queued task in sequence and clears all entries from the UI"
  - The backend stops streaming the file, removes the task from the in-memory queue, and deletes any partial file from disk
  - "If the task has already completed by the time the request arrives, the endpoint returns 404 and the UI handles it gracefully (removes the entry if still shown, otherwise ignores)"
  - "A cancelled download does not trigger the metadata-fetch step (F-07)"
  - The Cancel button is disabled (spinner or visual indicator) while the cancellation request is in flight to prevent double-clicks
api:
  - "DELETE /tiny-model-manager/api/downloads/{id} → stops the running or queued task, deletes partial file; returns 204 on success, 404 if task not found"
depends_on:
  - F-06
