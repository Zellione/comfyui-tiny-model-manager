feature_id: F-30
title: Choose Model Type Before HuggingFace Download
requirements:
  - "per-file model-type dropdown is displayed immediately in front of the Download button on every HuggingFace file row — both in the search-results \"Files\" pane and in the paste-a-link HF repository file list"
  - "file carries its own independently chosen type; downloading a file sends that row's selected type as `model_type` to `POST /api/download`, which determines the destination folder"
  - "HuggingFace has no batch \"Download selected\" — every file is downloaded individually via its own Download button; there are no row checkboxes and no shared header dropdown in HF file lists"
  - "CivitAI retains batch download (checkboxes + \"Download selected\") and its auto-detected model type; this feature does not affect CivitAI flows"
  - For CivitAI the type is auto-detected from the version response (existing F-18 behaviour) and need not be chosen — though F-33 still allows overriding it
depends_on:
  - F-18
  - F-33
