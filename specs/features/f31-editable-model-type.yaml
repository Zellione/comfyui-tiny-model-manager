feature_id: F-31
title: Editable Model Type (relocates file)
requirements:
  - "The model detail page shows the model type as an editable dropdown (checkpoints, loras embeddings, vae, controlnet, …)"
  - Changing it moves the model file from its current folder to the first registered `folder_paths` directory for the new type
  - "The `models.model_type` row is updated; trigger words, tags, media (hashed folder, F-27) description, and source info are preserved"
  - The base model (F-23) is editable from the same page
api:
  - "`POST /api/models/{type}/{path}/move` body `{ new_type }` → relocates the file on disk and updates the DB row"
depends_on:
  - F-27
  - F-23
