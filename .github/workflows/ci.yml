name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — tests & lint (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Normally ~30s. A ceiling keeps an async hang from running to GitHub's 6-hour default.
    timeout-minutes: 10

    # Proves the `requires-python = ">=3.10"` floor declared in pyproject.toml. Published
    # nodes are installed into whatever interpreter the user's ComfyUI runs on, so the
    # supported range has to be tested rather than assumed.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    env:
      # Keeps CWD off sys.path so pytest's own `import py` resolves to the installed py
      # library (py.path.local) rather than this repo's py/ backend package. Note this is
      # belt-and-braces only: PYTHONSAFEPATH was added in 3.11 and is ignored on 3.10, so
      # the pytest console script below is what actually makes the whole matrix work.
      PYTHONSAFEPATH: '1'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Ruff reads target-version from pyproject.toml, so its verdict is identical on every
      # interpreter — run it once rather than four times.
      - name: Ruff lint
        if: matrix.python-version == '3.13'
        run: python -m ruff check py tests conftest.py install.py

      - name: Ruff format check
        if: matrix.python-version == '3.13'
        run: python -m ruff format --check py tests conftest.py install.py

      # Console script, not `python -m pytest`: `-m` always prepends CWD to sys.path, which on
      # 3.10 (no PYTHONSAFEPATH) makes pytest's `import py` hit this repo's py/ package and die
      # with `module 'py' has no attribute 'path'`. The script leaves CWD off sys.path, and the
      # `pythonpath = ["."]` ini option still makes py.* importable from the tests themselves.
      - name: Pytest with coverage
        run: pytest --cov=py --cov-report=xml:coverage.xml

      # One artifact only: the name must stay unique for the sonarcloud job to download it.
      - name: Upload Python coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    name: Frontend — tests, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Angular build
        run: npx ng build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/lcov.info

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
