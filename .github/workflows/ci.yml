name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — tests & lint
    runs-on: ubuntu-latest

    env:
      # Prevent Python from prepending CWD to sys.path so that pytest's own
      # `import py` resolves to the installed py library (py.path.local) and
      # not the local py/ backend package, which has no py.path attribute.
      PYTHONSAFEPATH: '1'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check py tests conftest.py

      - name: Ruff format check
        run: python -m ruff format --check py tests conftest.py

      - name: Pytest
        run: python -m pytest

  frontend:
    name: Frontend — tests, lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Vitest (unit tests)
        run: npm run test:ci

      - name: Angular build
        run: npx ng build

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
