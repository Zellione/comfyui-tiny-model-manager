[project]
name = "tiny-model-manager"
version = "0.1.4"
description = "Browse, download, and manage AI models, LoRAs, and workflows from CivitAI and HuggingFace, with custom nodes that carry their documented trigger words."
# Table form, not `license = "MIT"`: the Registry documents the bare string as an invalid format.
# `text` and not `file`, because comfy-cli's `serialize_license` prefers `file` over `text` and
# publishes it verbatim — `{file = "LICENSE"}` is what made the API report a path, not a license.
license = { text = "MIT" }
# Neither `authors` nor `keywords` reaches the Registry: comfy-cli's ProjectConfig has no author
# field and its publish payload carries no tags. Declared for correct package metadata only — the
# blank author on the listing cannot be fixed from this file.
authors = [{ name = "Zellione", email = "nagels.sebastian@gmail.com" }]
keywords = ["comfyui", "civitai", "huggingface", "model-manager", "lora", "downloader"]
# Audited floor: the backend uses no syntax above builtin generics (3.9+), and every runtime
# dependency supports 3.9+. 3.10 is declared as a safety margin and proven by the CI matrix.
requires-python = ">=3.10"
# Keep in sync with requirements.txt — tests/test_packaging.py fails the build on drift.
dependencies = [
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "mistune>=3.0.0",
]
# The OS classifier is the only one the Registry consumes: comfy-cli maps `Operating System ::`
# and `Environment :: GPU ::` entries into `supported_os` / `supported_accelerators`. The license
# classifier is inert there but keeps the declared license readable to standard Python tooling.
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# comfy-cli reads exactly these four keys (`Issues`, not `BugTracker`), and forwards only
# `Repository` to the Registry. The rest are for humans and GitHub.
[project.urls]
Homepage = "https://github.com/Zellione/comfyui-tiny-model-manager"
Repository = "https://github.com/Zellione/comfyui-tiny-model-manager"
Documentation = "https://github.com/Zellione/comfyui-tiny-model-manager#readme"
Issues = "https://github.com/Zellione/comfyui-tiny-model-manager/issues"

[tool.comfy]
# Lowercase: this is the Registry publisher `id` (the handle after @ on the profile), which is
# not the same string as the display name "Zellione". /publishers/Zellione returns 404.
PublisherId = "zellione"
DisplayName = "Tiny Model Manager"
Icon = "https://raw.githubusercontent.com/Zellione/comfyui-tiny-model-manager/main/assets/icon.svg"
# requires-comfyui is deliberately omitted: a guessed lower bound blocks installs for no benefit.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib mode: each test file is imported as an independent module without
# climbing the parent package tree (avoids importing the project's __init__.py
# which requires a live ComfyUI server).
addopts = "--import-mode=importlib"
# Make the project root importable as "py.*"
pythonpath = ["."]
# Diagnostic for the intermittent backend hang (issue #118): if any single test takes longer
# than this, pytest dumps every thread's stack to stderr and lets the test continue. The whole
# suite normally finishes in ~7 s, so this never fires on a healthy run — but when CI stalls,
# the log gains an exact stack trace instead of going silent until the job timeout.
faulthandler_timeout = 60

[tool.coverage.run]
# asyncio + aiohttp workers never report back to the subprocess coverage
# collector; setting concurrency=thread avoids the post-run hang.
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 88

[tool.ruff]
# Must match requires-python, not the newest interpreter we happen to run: at py313 the UP
# rules would rewrite code into 3.12-only syntax and silently break the declared 3.10 floor.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes  I: isort  UP: pyupgrade  B: flake8-bugbear
# A: flake8-builtins  C4: flake8-comprehensions  RUF: ruff-specific
select = ["E", "F", "I", "UP", "B", "A", "C4", "RUF"]
ignore = [
    "E501",   # line too long — ruff format handles wrapping; long SQL strings are acceptable
    "B008",   # do not perform function calls in argument defaults (ComfyUI INPUT_TYPES pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
