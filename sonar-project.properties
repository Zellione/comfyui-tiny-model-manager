sonar.projectKey=Zellione_comfyui-tiny-model-manager
sonar.organization=zellione

sonar.sources=py,frontend/src,frontend/js
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**,frontend/src/**/*.spec.ts
sonar.exclusions=frontend/node_modules/**,web/**

# frontend/js/ holds the ComfyUI extension, loaded by ComfyUI straight from web/ rather than
# bundled into the Angular app. Its logic IS unit tested (see frontend/src/comfy-extension/),
# but it is not part of the Vitest coverageInclude set, so no lcov data exists for it and
# Sonar would score a tested file as 0%. Excluded from the coverage metric only; these files
# are still analysed for bugs, smells and security hotspots.
sonar.coverage.exclusions=frontend/js/**

sonar.python.version=3.12

sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
