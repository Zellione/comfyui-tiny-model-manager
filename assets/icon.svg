<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Tiny Model Manager">
  <title>Tiny Model Manager</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Stacked plates: a receding stack reads as "models" at any size. -->
  <g fill="#ffffff">
    <rect x="58" y="62" width="140" height="24" rx="12" opacity="0.45"/>
    <rect x="68" y="104" width="120" height="24" rx="12" opacity="0.72"/>
    <rect x="78" y="146" width="100" height="24" rx="12"/>
  </g>

  <!-- Download arrow: the manager's core action. -->
  <path d="M128 182v22m0 0-13-13m13 13 13-13" fill="none" stroke="#ffffff" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
