<header class="topbar">
  <div class="brand">
    <div class="brand-mark">τ</div>
    <div class="brand-name">Tiny Model Manager</div>
  </div>
  <nav class="tabs">
    <a class="tab" routerLink="/catalog" routerLinkActive="active">Catalog</a>
    <a class="tab" routerLink="/download" routerLinkActive="active">Download</a>
  </nav>
  <div class="topbar-right">
    <button
      class="icon-btn"
      (click)="toggleTheme()"
      [title]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      {{ isDark() ? '☀' : '☾' }}
    </button>
  </div>
</header>
<app-toast />
<main>
  <router-outlet />
</main>
