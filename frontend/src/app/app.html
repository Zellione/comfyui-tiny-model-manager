<header class="topbar">
  <div class="brand">
    <div class="brand-mark">τ</div>
    <div class="brand-name">Tiny Model Manager</div>
  </div>
  <nav class="tabs">
    <a class="tab" routerLink="/models" routerLinkActive="active">{{ 'nav.models' | translate }}</a>
    <a class="tab" routerLink="/workflows" routerLinkActive="active">{{
      'nav.workflows' | translate
    }}</a>
    <a class="tab" routerLink="/images" routerLinkActive="active">{{ 'nav.images' | translate }}</a>
    <a class="tab" routerLink="/download" routerLinkActive="active">{{
      'nav.download' | translate
    }}</a>
    <a class="tab" routerLink="/settings" routerLinkActive="active">{{
      'nav.settings' | translate
    }}</a>
  </nav>
  <div class="topbar-right">
    <button
      class="icon-btn"
      (click)="toggleTheme()"
      [title]="isDark() ? ('nav.theme_to_light' | translate) : ('nav.theme_to_dark' | translate)"
    >
      {{ isDark() ? '☀' : '☾' }}
    </button>
  </div>
</header>
<app-toast />
<main>
  <router-outlet />
</main>
