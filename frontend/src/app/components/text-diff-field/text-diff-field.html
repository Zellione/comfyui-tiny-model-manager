<div class="diff-field">
  <div class="diff-panels">
    <label
      class="diff-panel"
      [class.active]="selected() === 'old'"
      [class.dimmed]="selected() === 'new'"
    >
      <div class="panel-header">
        <span>{{ 'merge_field.current' | translate }}</span>
        @if (lastEditedAt()) {
          <span class="edited-icon" [title]="'merge_field.manually_edited' | translate">✏</span>
        }
        <input
          type="radio"
          name="diff-select"
          [checked]="selected() === 'old'"
          (change)="selectOld()"
        />
      </div>
      <div class="diff-content">
        @for (line of oldLines(); track $index) {
          <div class="diff-line" [class.diff-remove]="line.type === 'remove'">{{ line.text }}</div>
        }
        @if (oldLines().length === 0) {
          <div class="diff-empty">{{ 'merge_field.empty' | translate }}</div>
        }
      </div>
    </label>

    <label
      class="diff-panel"
      [class.active]="selected() === 'new'"
      [class.dimmed]="selected() === 'old'"
    >
      <div class="panel-header">
        <span>{{ 'merge_field.incoming' | translate }}</span>
        <input
          type="radio"
          name="diff-select"
          [checked]="selected() === 'new'"
          (change)="selectNew()"
        />
      </div>
      <div class="diff-content">
        @for (line of newLines(); track $index) {
          <div class="diff-line" [class.diff-add]="line.type === 'add'">{{ line.text }}</div>
        }
        @if (newLines().length === 0) {
          <div class="diff-empty">{{ 'merge_field.empty' | translate }}</div>
        }
      </div>
    </label>
  </div>
</div>
