<h2>Download Models</h2>

<!-- Tab bar -->
<div class="download-tabs">
  <button
    class="download-tab"
    [class.download-tab--active]="activeTab() === 'active'"
    (click)="activeTab.set('active')"
  >
    Active
  </button>
  <button
    class="download-tab"
    [class.download-tab--active]="activeTab() === 'history'"
    (click)="activeTab.set('history')"
  >
    History
  </button>
</div>

@if (activeTab() === 'active') {
  <!-- Active downloads -->
  <app-download-queue />

  <!-- Paste a link -->
  <app-paste-link />

  <!-- Search -->
  <app-download-search />
}
<!-- /active tab -->

@if (activeTab() === 'history') {
  <app-download-history (switchToActive)="activeTab.set('active')" />
}
<!-- /history tab -->
